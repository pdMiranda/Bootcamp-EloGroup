<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vértice Retail | Atendimento Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white h-screen w-screen overflow-hidden m-0 p-0 font-sans flex flex-col">

    <!-- Container do Chatbot -->
    <div class="w-full h-full bg-white flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="bg-[#075e54] text-white p-3 flex items-center justify-between shadow-md shrink-0">
            <div class="flex items-center gap-2.5">
                <div class="relative">
                    <div class="w-9 h-9 rounded-full bg-emerald-800 border border-emerald-600 flex items-center justify-center font-bold text-xs text-emerald-100">
                        VR
                    </div>
                    <span id="bot-indicator" class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-amber-400 border-2 border-[#075e54] rounded-full"></span>
                </div>
                <div>
                    <h1 class="text-sm font-semibold tracking-wide leading-tight">Vértice Atendimento</h1>
                    <p id="bot-status" class="text-[11px] text-emerald-200">Carregando bases de dados...</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="exportarPlanilhaAtendimentos()" title="Baixar histórico CSV de atendimentos" class="text-emerald-200 hover:text-white text-xs bg-emerald-900/50 px-2 py-1 rounded border border-emerald-700/50 transition flex items-center gap-1">
                    CSV
                </button>
                <button onclick="reiniciarConversa()" title="Reiniciar atendimento" class="text-emerald-200 hover:text-white text-xs bg-emerald-900/50 px-2 py-1 rounded border border-emerald-700/50 transition">
                    ↺
                </button>
            </div>
        </header>

        <main id="chat-box" class="flex-1 bg-[#efeae2] p-3 overflow-y-auto space-y-3">
            <!-- Mensagens injetadas via JS -->
        </main>

        <!-- Indicador de Digitação -->
        <div id="typing-indicator" class="hidden px-4 py-1 text-xs text-slate-500 bg-[#efeae2] italic flex items-center gap-1.5 shrink-0">
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></span>
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></span>
            Atendente digitando...
        </div>

        <!-- Barra de Digitação -->
        <footer class="p-2.5 bg-[#f0f2f5] border-t border-slate-200 flex gap-2 items-center shrink-0">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Carregando..." 
                class="flex-1 text-sm bg-white rounded-full px-4 py-2 border border-slate-300 focus:outline-none focus:border-emerald-600 transition"
                disabled
            />
            <button 
                id="send-btn" 
                class="bg-[#075e54] text-white rounded-full w-9 h-9 flex items-center justify-center hover:bg-emerald-800 transition disabled:opacity-50 shrink-0"
                disabled
            >
                &rarr;
            </button>
        </footer>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
