<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Case Varejo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .metadata {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 14px;
        }

        .metadata span {
            background: #f0f0f0;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .insights-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .insights-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .insight-card {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid;
        }

        .insight-card.alerta {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .insight-card.oportunidade {
            background: #d4edda;
            border-color: #28a745;
        }

        .insight-card .area {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .insight-card .mensagem {
            color: #555;
            margin-bottom: 10px;
        }

        .insight-card .acao {
            font-style: italic;
            color: #666;
            font-size: 14px;
        }

        .kpis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-card h3 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .kpi-label {
            color: #888;
            font-size: 14px;
        }

        .chart-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .chart-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .time-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .time-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .time-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .time-btn:hover:not(.active) {
            background: #e0e0e0;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table th,
        .products-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .products-table th {
            background: #f8f9fa;
            color: #333;
            font-weight: 600;
        }

        .products-table tr:hover {
            background: #f8f9fa;
        }

        .section-title {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .kpi-group {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .kpi-group h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .kpi-grid-small {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .kpi-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .kpi-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .kpi-item .label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .impact-highlight {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .impact-highlight h2 {
            margin-bottom: 20px;
        }

        .impact-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .impact-item {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 10px;
        }

        .impact-item .value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .impact-item .label {
            font-size: 14px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .impact-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Dashboard Executivo - Case Varejo</h1>
            <div class="metadata">
                <span id="janela-analise">Período: --</span>
                <span id="data-atualizacao">Atualização: --</span>
            </div>
        </header>

        <!-- Insights Section -->
        <div class="insights-section">
            <h2>🎯 Insights & Ações Prioritárias</h2>
            <div id="insights-container"></div>
        </div>

        <!-- Impacto Financeiro -->
        <div class="impact-highlight">
            <h2>💰 Impacto Financeiro Identificado</h2>
            <div class="impact-grid" id="impact-grid">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- KPIs Principais -->
        <div class="kpis-grid" id="kpis-principais">
            <!-- Preenchido via JS -->
        </div>

        <!-- Gráfico Temporal -->
        <div class="chart-section">
            <h2>📈 Evolução da Receita Bruta</h2>
            <div class="time-selector">
                <button class="time-btn active" data-period="dia">Dia</button>
                <button class="time-btn" data-period="semana">Semana</button>
                <button class="time-btn" data-period="mes">Mês</button>
            </div>
            <div class="chart-container">
                <canvas id="temporalChart"></canvas>
            </div>
        </div>

        <!-- Duas Colunas: Produtos e KPIs Detalhados -->
        <div class="two-columns">
            <!-- Top Produtos -->
            <div class="chart-section">
                <h2>🏆 Top 10 Produtos Mais Vendidos</h2>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Qtd</th>
                            <th>Receita</th>
                            <th>Margem</th>
                        </tr>
                    </thead>
                    <tbody id="top-produtos-body">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Canais de Marketing -->
            <div class="chart-section">
                <h2>📢 ROAS por Canal</h2>
                <div class="chart-container" style="height: 300px;">
                    <canvas id="roasChart"></canvas>
                </div>
            </div>
        </div>

        <!-- KPIs Detalhados por Área -->
        <div class="kpi-group">
            <h3>📦 Operações</h3>
            <div class="kpi-grid-small" id="kpi-operacoes">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <div class="kpi-group">
            <h3>👥 Cliente</h3>
            <div class="kpi-grid-small" id="kpi-cliente">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <div class="kpi-group">
            <h3>🎧 Atendimento</h3>
            <div class="kpi-grid-small" id="kpi-atendimento">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <div class="kpi-group">
            <h3>⚡ Produtividade</h3>
            <div class="kpi-grid-small" id="kpi-produtividade">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <script>
        let dashboardData = null;
        let temporalChart = null;
        let roasChart = null;

        // Carregar dados
        async function loadDashboard() {
            try {
                const response = await fetch('dashboard_data.json');
                dashboardData = await response.json();
                
                updateMetadata();
                renderInsights();
                renderImpact();
                renderKpisPrincipais();
                renderTemporalChart('dia');
                renderTopProdutos();
                renderRoasChart();
                renderKpisDetalhados();
                
                setupTimeSelector();
            } catch (error) {
                console.error('Erro ao carregar dashboard:', error);
            }
        }

        function updateMetadata() {
            const meta = dashboardData.metadata;
            document.getElementById('janela-analise').textContent = 
                `Período: ${meta.janela_analise.inicio} até ${meta.janela_analise.fim}`;
            document.getElementById('data-atualizacao').textContent = 
                `Atualização: ${new Date(meta.data_atualizacao).toLocaleDateString('pt-BR')}`;
        }

        function renderInsights() {
            const container = document.getElementById('insights-container');
            const insights = dashboardData.insights;
            
            container.innerHTML = insights.map(insight => `
                <div class="insight-card ${insight.tipo}">
                    <div class="area">${insight.area} • Impacto: ${insight.impacto}</div>
                    <div class="mensagem">${insight.mensagem}</div>
                    <div class="acao">🎯 Ação: ${insight.acao}</div>
                </div>
            `).join('');
        }

        function renderImpact() {
            const impact = dashboardData.kpis.impacto;
            const container = document.getElementById('impact-grid');
            
            const items = [
                { label: 'EBITDA Potencial', value: formatCurrency(impact.ebitda_potencial) },
                { label: 'Economia Estimada', value: formatCurrency(impact.economia_estimada) },
                { label: 'Receita Protegida', value: formatCurrency(impact.receita_protegida) },
                { label: 'Payback', value: impact.payback + ' meses' }
            ];
            
            container.innerHTML = items.map(item => `
                <div class="impact-item">
                    <div class="value">${item.value}</div>
                    <div class="label">${item.label}</div>
                </div>
            `).join('');
        }

        function renderKpisPrincipais() {
            const comercial = dashboardData.kpis.comercial;
            const container = document.getElementById('kpis-principais');
            
            const kpis = [
                { title: 'Receita Bruta', value: formatCurrency(comercial.receita_bruta), label: 'No período' },
                { title: 'Pedidos', value: comercial.pedidos.toLocaleString(), label: 'Total' },
                { title: 'Ticket Médio', value: formatCurrency(comercial.ticket_medio), label: 'Por pedido' },
                { title: 'Margem Contribuição', value: formatCurrency(dashboardData.kpis.margem.margem_contribuicao), label: 'Total' }
            ];
            
            container.innerHTML = kpis.map(kpi => `
                <div class="kpi-card">
                    <h3>${kpi.title}</h3>
                    <div class="kpi-value">${kpi.value}</div>
                    <div class="kpi-label">${kpi.label}</div>
                </div>
            `).join('');
        }

        function renderTemporalChart(period) {
            const ctx = document.getElementById('temporalChart').getContext('2d');
            const data = dashboardData.temporal[period];
            
            if (temporalChart) {
                temporalChart.destroy();
            }
            
            temporalChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.periodo),
                    datasets: [{
                        label: 'Receita Bruta (R$)',
                        data: data.map(d => d.receita_bruta),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }, {
                        label: 'Margem Contribuição (R$)',
                        data: data.map(d => d.margem_contribuicao),
                        borderColor: '#28a745',
                        backgroundColor: 'rgba(40, 167, 69, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: value => 'R$ ' + value.toLocaleString('pt-BR', { maximumFractionDigits: 0 })
                            }
                        }
                    }
                }
            });
        }

        function setupTimeSelector() {
            const buttons = document.querySelectorAll('.time-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderTemporalChart(btn.dataset.period);
                });
            });
        }

        function renderTopProdutos() {
            const produtos = dashboardData.top_produtos;
            const tbody = document.getElementById('top-produtos-body');
            
            tbody.innerHTML = produtos.map(p => `
                <tr>
                    <td>${p.produto.substring(0, 40)}${p.produto.length > 40 ? '...' : ''}</td>
                    <td>${p.quantidade}</td>
                    <td>${formatCurrency(p.receita_bruta)}</td>
                    <td>${formatCurrency(p.margem_contribuicao)}</td>
                </tr>
            `).join('');
        }

        function renderRoasChart() {
            const ctx = document.getElementById('roasChart').getContext('2d');
            const margemPorCanal = dashboardData.kpis.marketing.margem_por_canal;
            
            if (roasChart) {
                roasChart.destroy();
            }
            
            roasChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(margemPorCanal),
                    datasets: [{
                        label: 'ROAS',
                        data: Object.values(margemPorCanal),
                        backgroundColor: [
                            '#667eea',
                            '#764ba2',
                            '#f093fb',
                            '#f5576c',
                            '#4facfe',
                            '#43e97b',
                            '#fa709a'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: value => value + 'x'
                            }
                        }
                    }
                }
            });
        }

        function renderKpisDetalhados() {
            // Operações
            const operacoes = dashboardData.kpis.operacoes;
            document.getElementById('kpi-operacoes').innerHTML = `
                <div class="kpi-item">
                    <div class="value">${operacoes.taxa_devolucao}%</div>
                    <div class="label">Taxa Devolução</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${operacoes.ruptura}%</div>
                    <div class="label">Ruptura Estoque</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${operacoes.giro_estoque}</div>
                    <div class="label">Giro Estoque</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${operacoes.lead_time} dias</div>
                    <div class="label">Lead Time</div>
                </div>
            `;
            
            // Cliente
            const cliente = dashboardData.kpis.cliente;
            document.getElementById('kpi-cliente').innerHTML = `
                <div class="kpi-item">
                    <div class="value">${cliente.recompra}%</div>
                    <div class="label">Recompra</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${formatCurrency(cliente.ltv)}</div>
                    <div class="label">LTV Médio</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${cliente.churn}%</div>
                    <div class="label">Churn</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${Object.keys(cliente.segmentos).length}</div>
                    <div class="label">Segmentos</div>
                </div>
            `;
            
            // Atendimento
            const atendimento = dashboardData.kpis.atendimento;
            document.getElementById('kpi-atendimento').innerHTML = `
                <div class="kpi-item">
                    <div class="value">${atendimento.volume_tickets}</div>
                    <div class="label">Volume Tickets</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${atendimento.sla}%</div>
                    <div class="label">SLA</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${atendimento.sentimento}/5</div>
                    <div class="label">Sentimento</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${formatCurrency(atendimento.custo_por_ticket)}</div>
                    <div class="label">Custo/Ticket</div>
                </div>
            `;
            
            // Produtividade
            const produtividade = dashboardData.kpis.produtividade;
            document.getElementById('kpi-produtividade').innerHTML = `
                <div class="kpi-item">
                    <div class="value">${produtividade.horas_economizadas}h</div>
                    <div class="label">Horas Economizadas</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${produtividade.automacao_potencial}%</div>
                    <div class="label">Automação Potencial</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${produtividade.retrabalho_reduzido}</div>
                    <div class="label">Retrabalho Reduzido</div>
                </div>
                <div class="kpi-item">
                    <div class="value">${produtividade.tempo_resposta}min</div>
                    <div class="label">Tempo Resposta</div>
                </div>
            `;
        }

        function formatCurrency(value) {
            return 'R$ ' + value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Inicializar dashboard
        loadDashboard();
    </script>
</body>
</html>
