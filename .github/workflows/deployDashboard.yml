name: Deploy Dashboard to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        run: |
          mkdir -p Case/dashboard/modulos
          cp -r Case/modulos/chatbot Case/dashboard/modulos/
          cp -r Case/data Case/dashboard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Case/dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
